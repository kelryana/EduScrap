version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: eduscrap-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - eduscrap-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: eduscrap-backend:v2.0-chromium
    container_name: eduscrap-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DB=hub_estudantes
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - mongodb
    networks:
      - eduscrap-network

  scraper-runner:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: eduscrap-scraper-runner:v2.0-chromium
    container_name: eduscrap-scraper-runner
    command: python run_scrapers.py
    restart: "on-failure:3"
    volumes:
      - .:/app
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DB=hub_estudantes
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run_scrapers.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - mongodb
    networks:
      - eduscrap-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eduscrap-frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/app
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - backend
    networks:
      - eduscrap-network

volumes:
  mongodb_data:
    driver: local

networks:
  eduscrap-network:
    driver: bridge
