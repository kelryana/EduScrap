version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: eduscrap-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - eduscrap-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eduscrap-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DB=hub_estudantes
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    depends_on:
      - mongodb
    networks:
      - eduscrap-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eduscrap-frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/app
    depends_on:
      - backend
    networks:
      - eduscrap-network

volumes:
  mongodb_data:
    driver: local

networks:
  eduscrap-network:
    driver: bridge
